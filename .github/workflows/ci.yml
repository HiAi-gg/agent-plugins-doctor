name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  publish:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write  # Required for OIDC Trusted Publisher
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Node 24 bundles npm >= 11.5.1, which is required for npm Trusted
      # Publisher (OIDC). setup-node's registry-url configures npm so the CLI
      # can auto-detect the OIDC environment and exchange the token.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run build
      - name: Publish to npm
        working-directory: packages/npm
        run: npm publish --access public
